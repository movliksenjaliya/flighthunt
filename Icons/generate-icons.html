## 9. `icons/generate-icons.html`
> Open this file in a browser to generate placeholder icons

```html
<!DOCTYPE html>
<html>
<head>
  <title>Generate FlightHunt Icons</title>
  <style>
    body {
      font-family: sans-serif;
      background: #0f0f1a;
      color: white;
      padding: 2rem;
    }
    button {
      background: #e94560;
      color: white;
      border: none;
      padding: 1rem 2rem;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      margin: 1rem 0;
      display: block;
    }
    canvas { display: none; }
    .links a {
      color: #e94560;
      display: block;
      margin: 0.3rem 0;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <h2>✈️ FlightHunt Icon Generator</h2>
  <p>Click the button to generate and download all required PWA icons.</p>
  <button onclick="generateAll()">Generate & Download All Icons</button>
  <div class="links" id="links"></div>
  <canvas id="canvas"></canvas>

  <script>
    const SIZES = [72, 96, 128, 144, 152, 192, 384, 512];

    function drawIcon(canvas, size) {
      const ctx = canvas.getContext('2d');
      canvas.width  = size;
      canvas.height = size;

      // Background
      const grad = ctx.createLinearGradient(0, 0, size, size);
      grad.addColorStop(0, '#1a1a2e');
      grad.addColorStop(1, '#0f3460');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.roundRect(0, 0, size, size, size * 0.2);
      ctx.fill();

      // Plane emoji scaled to icon size
      const fontSize = size * 0.5;
      ctx.font       = `${fontSize}px serif`;
      ctx.textAlign  = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('✈️', size / 2, size / 2);

      // Red dot (accent)
      const dotR = size * 0.08;
      ctx.beginPath();
      ctx.arc(size * 0.75, size * 0.28, dotR, 0, Math.PI * 2);
      ctx.fillStyle = '#e94560';
      ctx.fill();
    }

    function generateAll() {
      const canvas   = document.getElementById('canvas');
      const linksDiv = document.getElementById('links');
      linksDiv.innerHTML = '';

      SIZES.forEach(size => {
        drawIcon(canvas, size);
        canvas.toBlob(blob => {
          const url = URL.createObjectURL(blob);
          const a   = document.createElement('a');
          a.href     = url;
          a.download = `icon-${size}.png`;
          a.textContent = `⬇ Download icon-${size}.png`;
          linksDiv.appendChild(a);
          // Auto-click to trigger download
          a.click();
        }, 'image/png');
      });
    }
  </script>
</body>
</html>
